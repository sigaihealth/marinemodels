name: Pioneer fixed-model storm scoring

on:
  schedule:
    - cron: '23 4,10,16,22 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pioneer-fixed-model-storm-scores
  cancel-in-progress: false

jobs:
  score:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out the frozen study and its scoring code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out published scores
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: pioneer-storm-scores
          path: _results

      - name: Check whether additional storms are needed
        id: state
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          complete = json.loads(Path("_results/state.json").read_text())["study_complete"]
          if not isinstance(complete, bool):
              raise ValueError("Expected a boolean study_complete in the results branch")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"complete={str(complete).lower()}", file=output)
          PYTHON

      - name: Refresh observations and score eligible storms
        if: steps.state.outputs.complete == 'false'
        run: |
          study="$GITHUB_WORKSPACE/world-model/pioneer-fixed-confirmation"
          python "$study/refresh_inputs.py" \
            --out "$RUNNER_TEMP/pioneer-input" \
            --cache "$RUNNER_TEMP/pioneer-cache" \
            --world-model "$GITHUB_WORKSPACE/world-model"
          python "$study/score.py" \
            --data "$RUNNER_TEMP/pioneer-input" \
            --output "$GITHUB_WORKSPACE/_results"

      - name: Publish updated results
        if: steps.state.outputs.complete == 'false'
        working-directory: _results
        run: |
          git add --all -- .
          if git diff --cached --quiet; then
            echo 'No changes to the published scores.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update fixed-model Pioneer storm observations and scores'
          git push origin HEAD:refs/heads/pioneer-storm-scores
